<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300..900&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" type="text/css" href="./src/styles/general.css" />
    <link rel="stylesheet" type="text/css" href="./src/styles/animations.css" />
    <link rel="stylesheet" type="text/css" href="./src/styles/components.css" />
    <link rel="stylesheet" type="text/css" href="./src/styles/style.css" />
    <title>App</title>
  </head>
  <body>
    <header class="header">
      <img src="public/logo.svg" alt="Logo" class="logo" />
      <nav class="header__navigation">
        <ul>
          <li><button class="nav__item">About us</button></li>
          <li><button class="nav__item">Contact</button></li>
          <li><button class="nav__item">News</button></li>
        </ul>
      </nav>
      <button
        class="open-dialog-subscribe open-dialog-subscribe-desktop button button--fill"
      >
        Subscribe
      </button>
      <button class="button button--icon" id="open-dialog-menu">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="feather feather-menu"
        >
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      </button>
    </header>

    <main>
      <section></section>
    </main>

    <dialog class="dialog dialog-menu">
      <header class="dialog-menu__header">
        <img src="public/logo.svg" alt="Logo" class="logo" />
        <button
          class="button button--icon dialog-menu__button--close"
          id="close-dialog-menu"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="rgba(18, 41, 54, 1)"
            stroke-width="1"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="feather feather-x"
          >
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </header>
      <nav class="dialog-menu__navigation">
        <ul>
          <li><button class="nav__item">About us</button></li>
          <li><button class="nav__item">Contact</button></li>
          <li><button class="nav__item">News</button></li>
        </ul>
      </nav>
      <button class="open-dialog-subscribe button button--fill">
        Subscribe
      </button>
    </dialog>
    <dialog class="dialog dialog-subscribe">
      <button
        class="button button--icon dialog-subscribe__button--close"
        id="close-dialog-subscribe"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="rgba(18, 41, 54, 1)"
          stroke-width="1"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="feather feather-x"
        >
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
      <div class="dialog-subscribe__image">
        <img src="/public/subscribe-image.jpg" alt="" />
      </div>
      <div class="dialog-subscribe__text">
        <h4 class="heading-4 mb-16">Follow the latest news</h4>
        <p class="sub-heading mb-20">With our daily newsletter</p>
        <form class="dialog-subscribe__form">
          <input placeholder="you@example.com" type="email" required />
          <button class="button button--fill" type="submit">Submit</button>
        </form>
      </div>
    </dialog>
    <div class="toast toast-subscribe--success">
      Form submitted successfully
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
